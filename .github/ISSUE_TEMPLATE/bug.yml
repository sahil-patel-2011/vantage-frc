name: Bug
description: Something is broken in Vantage (product, tenancy, or self-host).
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do **not** paste Neon passwords, `DATABASE_*`
        URLs, API keys, or student data. See `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. npm install
        2. …
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Postgres host
      options:
        - Neon (docs/NEON.md)
        - Local Postgres
        - Other / not sure
        - No database (unit tests / empty states only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or commit SHA
      description: `git rev-parse --short HEAD`
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not paste secrets into this issue.
          required: true
        - label: I ran `npm test` (or explain why not).
          required: false
