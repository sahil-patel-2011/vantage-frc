name: Docs / Neon / self-host
description: Documentation, Neon setup, migrations, or contributor path.
title: "[docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Docs must match real scripts and real env names. Preferred references:
        `docs/NEON.md`, `.env.example`, `scripts/run-migrations.mjs`,
        `scripts/map-neon-env.mjs`, `CONTRIBUTING.md`.
  - type: textarea
    id: gap
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What a new clone should be able to do
    validations:
      required: true
