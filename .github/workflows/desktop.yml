name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@vantage/desktop
      - run: npm test --workspace=@vantage/desktop
      - run: npm run dist --workspace=@vantage/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: vantage-desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@vantage/desktop
      - run: npm test --workspace=@vantage/desktop
      - run: npm run dist:mac --workspace=@vantage/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: vantage-desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

  release:
    needs: [windows, macos]
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build latest.json and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_SHELL_VERSION: "0.0.0"
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} out/ \;
          nsis="$(ls out/*-setup.exe 2>/dev/null | head -n1 || true)"
          msi="$(ls out/*.msi 2>/dev/null | head -n1 || true)"
          dmg="$(ls out/*.dmg 2>/dev/null | head -n1 || true)"
          if [ -z "$nsis" ]; then
            echo "Windows NSIS installer missing"
            exit 1
          fi
          export V="$(node -p "require('./apps/desktop/package.json').version")"
          export D="$(sha256sum "$nsis" | cut -d' ' -f1)"
          export NSIS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$nsis")"
          export MSI_URL=""
          export DMG_URL=""
          if [ -n "$msi" ]; then
            export MSI_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$msi")"
          fi
          if [ -n "$dmg" ]; then
            export DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$dmg")"
          fi
          node -e '
            const fs = require("fs");
            const downloads = { win_nsis: process.env.NSIS_URL, win_msi: process.env.MSI_URL || null, mac_dmg: process.env.DMG_URL || null };
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version: process.env.V,
              minimumVersion: process.env.MINIMUM_SHELL_VERSION,
              minimumSupported: process.env.MINIMUM_SHELL_VERSION,
              url: process.env.NSIS_URL,
              sha256: process.env.D,
              downloads,
              notes: "Unsigned. SmartScreen and Gatekeeper will warn until signing credentials exist. The window loads the hosted Vantage web app.",
            }, null, 2) + "\n");
          '
          files=(out/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Vantage desktop $GITHUB_REF_NAME" \
              --notes "Unsigned Windows NSIS + MSI and macOS DMG (when the macOS job succeeded). SmartScreen/Gatekeeper will warn until Authenticode and Apple notarization credentials exist. The window loads https://vantage-frc-web.vercel.app — the same invite-only product as the web app."
          fi
          gh release edit "$GITHUB_REF_NAME" --latest
