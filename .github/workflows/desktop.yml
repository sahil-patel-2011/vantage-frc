name: Desktop Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@vantage/desktop
      - run: npm test --workspace=@vantage/desktop
      - run: npm run dist --workspace=@vantage/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: vantage-desktop-windows
          path: apps/desktop/release/*.exe
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          files=(apps/desktop/release/*.exe)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Vantage desktop $GITHUB_REF_NAME" \
              --notes "Unsigned Windows installer and portable build. SmartScreen will warn until Authenticode certs exist. The window loads https://vantage-frc-web.vercel.app — the same invite-only product as the web app."
          fi
