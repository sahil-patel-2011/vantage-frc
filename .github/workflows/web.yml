name: Web PR CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Also build what actually landed. 2,495 commits once reached main while CI
  # ran on pull_request only: every small PR passed on its own branch, and the
  # accumulated result — which no longer typechecked or tested at all — was
  # never built once. Per-PR green does not mean main is green.
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR run saves minutes and costs nothing: the branch moved on.
  # Superseding a push to main destroys the only evidence that main works.
  #
  # Three pushes in a row here each cancelled the one before, and a cancelled
  # run reports as a failure — so main showed red for twenty minutes of CI that
  # had nothing wrong with it, and a genuine break would have looked exactly
  # the same. main is what deploys; its runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migration static checks
        run: npm run test:migrations
      - name: Build web without production secrets
        run: npm run build --workspace=@vantage/web

  browser:
    name: Playwright (${{ matrix.shard }}/6)
    # Private-repo Actions minutes: skip Chromium on draft pushes.
    # Full suite runs when the PR is marked ready, or via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Six shards, each with its own Postgres service and dev server, plus swap.
    # `next dev` keeps every route it has compiled in memory: measured locally at
    # 5.6 GB after 82 specs and still climbing. A private-repo runner has ~7 GB,
    # so the runner was killed ("received a shutdown signal") about six minutes
    # into the tests — as one job, and again as three shards. A sixth of the routes
    # per dev server keeps each one well under that, and the swap turns a spike
    # into a slower run instead of a dead runner. Specs clear their own rows, so a
    # shard does not depend on rows another file created. fail-fast off: one red
    # shard should not hide the results of the others.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # A full signed-in pass is around 55 minutes in one job; a sixth is ~10.
    #
    # Still one worker per shard: within a shard the specs share one dev server and
    # one database, and several create rows another spec then counts. Across
    # shards the databases are separate, which only removes that interference.
    timeout-minutes: 45
    # This job had no database, so Better Auth could not look a user up, every
    # sign-in failed, and the suite reported a wall of assertion failures that
    # had nothing to do with the code under test. `E2E_AUTH_FIXTURE` made it
    # worse rather than better: proxy.ts lets pages render while every
    # `/api/*` answers 404, so specs measured half-painted screens.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: "development"
      NEXT_TELEMETRY_DISABLED: "1"
      # The database name has to contain "ci" or "test": tests/browser/origin.ts
      # refuses to start Playwright against anything else, which is what stops
      # a stray production URL from being pointed at a destructive seed.
      PGBASE: postgresql://postgres:postgres@127.0.0.1:5432
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://app_login:app@127.0.0.1:5432/vantage_ci?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://app_login:app@127.0.0.1:5432/vantage_ci?sslmode=disable
      DATABASE_AUTH_URL: postgresql://auth_login:auth@127.0.0.1:5432/vantage_ci?sslmode=disable
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantage_ci?sslmode=disable
      # Unused here on purpose: `CI=true` puts the waitlist on the in-memory
      # store, so nothing connects with this. Note that the role is wrong for
      # the real thing — `waitlist_signups` is granted to `vantage_marketing`
      # only, and a deployment that copies this line gets "permission denied
      # for table waitlist_signups". The store now says so in as many words.
      MARKETING_DATABASE_URL: postgresql://app_login:app@127.0.0.1:5432/vantage_ci?sslmode=disable
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      DEV_KMS_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DEV_OTP_SECRET: ci-only-otp-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create the scratch database
        run: |
          psql "$PGBASE/postgres" -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE vantage_ci TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C' ENCODING 'UTF8'"
      - name: Apply migrations
        run: node scripts/run-migrations.mjs
      - name: Create the non-superuser logins the app connects as
        env:
          RLS_PROOF_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantage_ci
        run: |
          RLS_PROOF_APP_URL=postgresql://app_login:app@127.0.0.1:5432/vantage_ci \
            RLS_PROOF_SET_ROLE=vantage_app node scripts/rls-proof-prepare-app-login.mjs
          RLS_PROOF_APP_URL=postgresql://auth_login:auth@127.0.0.1:5432/vantage_ci \
            RLS_PROOF_SET_ROLE=vantage_auth node scripts/rls-proof-prepare-app-login.mjs
      - name: Seed a team, an event, and two logins the suite can sign in as
        run: |
          node scripts/seed-dev.mjs
          node scripts/seed-e2e-logins.mjs
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Add swap (next dev keeps every compiled route in memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/vantage-swap
          sudo chmod 600 /mnt/vantage-swap
          sudo mkswap /mnt/vantage-swap
          sudo swapon /mnt/vantage-swap
          free -h
      - name: Run browser tests
        run: npm run test:browser -- --reporter=line,html --shard=${{ matrix.shard }}/6
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: Postgres migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vantage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vantage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply migrations twice and verify RLS
        run: npm run test:db:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantage_ci
      - name: Prove newest org-scoped tables as vantage_app
        env:
          RLS_PROOF_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantage_ci
          RLS_PROOF_APP_URL: postgresql://vantage_ci_app:app@127.0.0.1:5432/vantage_ci
        run: |
          node scripts/rls-proof-prepare-app-login.mjs
          node scripts/rls-proof.mjs
      - name: Upload migration failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-failure-log
          path: scripts/migration-failures.log
          if-no-files-found: ignore
          retention-days: 7
