<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vantage — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f2;
        --panel: #ffffff;
        --ink: #17150f;
        --muted: #5c574b;
        --line: #e4e1d7;
        --accent: #17150f;
        --accent-ink: #f7f6f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14130f;
          --panel: #1d1b16;
          --ink: #f2f0e9;
          --muted: #a9a494;
          --line: #2c2a23;
          --accent: #f2f0e9;
          --accent-ink: #14130f;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(30rem, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 40px 36px;
      }
      .word {
        font-size: 0.8rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 20px;
      }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
      p { color: var(--muted); line-height: 1.55; margin-bottom: 10px; }
      .actions { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; }
      button.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 0 22px;
        border-radius: 10px;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-ink);
        border: 1px solid var(--accent);
      }
      .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .fine { margin-top: 22px; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="word">Vantage</div>
      <h1 id="title">Can't reach Vantage</h1>
      <p id="body">Vantage isn't reachable right now. Check your connection, then try again.</p>
      <div class="actions">
        <button class="button" id="retry" type="button">Try again</button>
      </div>
      <p class="fine" id="hint">Ctrl+R also tries again.</p>
    </main>
    <script>
      (function () {
        var COPY = {
          offline: {
            title: "You're offline",
            body: "This computer is not connected. Check Wi-Fi, then try again."
          },
          timeout: {
            title: "Can't reach Vantage",
            body: "Vantage took too long to answer. Venue Wi-Fi can do this — try again in a moment."
          },
          local: {
            title: "Can't reach Vantage",
            body: "Vantage isn't running on this computer yet. Start it, then try again."
          },
          unreachable: {
            title: "Can't reach Vantage",
            body: "Vantage isn't reachable right now. Check your connection, then try again."
          }
        };
        var reason = "unreachable";
        try {
          var raw = new URLSearchParams(location.search).get("reason") || "";
          if (raw === "offline" || raw === "timeout" || raw === "local" || raw === "unreachable") {
            reason = raw;
          }
        } catch (e) {}
        var copy = COPY[reason] || COPY.unreachable;
        document.getElementById("title").textContent = copy.title;
        document.getElementById("body").textContent = copy.body;
        document.getElementById("retry").textContent = "Try again";
        document.getElementById("hint").textContent = "Ctrl+R also tries again.";

        document.getElementById("retry").addEventListener("click", function () {
          var api = window.vantageDesktop;
          if (api && typeof api.retry === "function") {
            api.retry();
            return;
          }
          location.reload();
        });
      })();
    </script>
  </body>
</html>
