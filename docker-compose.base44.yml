services:
  db:
    image: postgres:17
    restart: on-failure
    environment:
      - POSTGRES_PASSWORD=vantage_dev
      - POSTGRES_DB=vantage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vantage"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  install:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install --no-audit --no-fund"

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_ADMIN_URL=postgres://postgres:vantage_dev@db:5432/vantage?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    # Migrations create the vantage_* group roles as NOLOGIN; then add one login per group for the app URLs.
    command:
      - sh
      - -ec
      - |
        npm run db:migrate
        node <<'JS'
        const pg = require("pg");
        (async () => {
          const db = new pg.Client({ connectionString: process.env.DATABASE_ADMIN_URL });
          await db.connect();
          for (const group of ["app", "auth", "marketing", "worker"]) {
            const login = "vantage_" + group + "_login";
            const { rowCount } = await db.query("SELECT 1 FROM pg_roles WHERE rolname = $$1", [login]);
            if (rowCount === 0) await db.query("CREATE ROLE " + login + " LOGIN PASSWORD 'vantage_dev'");
            await db.query("GRANT vantage_" + group + " TO " + login);
            console.log("login ready: " + login);
          }
          await db.end();
        })().catch((err) => { console.error(err); process.exit(1); });
        JS

  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes:
      - .:/app
      - next-cache:/app/apps/web/.next
      - swc-cache:/root/.cache/next-swc
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BETTER_AUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_APP_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - AUTH_TRUSTED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DATABASE_URL=postgres://vantage_app_login:vantage_dev@db:5432/vantage?sslmode=disable
      - DATABASE_AUTH_URL=postgres://vantage_auth_login:vantage_dev@db:5432/vantage?sslmode=disable
      - DATABASE_ADMIN_URL=postgres://postgres:vantage_dev@db:5432/vantage?sslmode=disable
      - MARKETING_DATABASE_URL=postgres://vantage_marketing_login:vantage_dev@db:5432/vantage?sslmode=disable
    env_file:
      - /run/base44/app.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    tty: true
    stdin_open: true
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    command: sh -c "/app/node_modules/.bin/next dev --port 3000 --hostname 0.0.0.0"

volumes:
  db-data:
  next-cache:
  swc-cache:
