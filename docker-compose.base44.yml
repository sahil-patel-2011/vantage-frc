# Base44 dev environment for Vantage (Next.js 16 monorepo).
#
# Runs the web app from cloned source with live reload against a local
# Postgres 17 that mirrors CI (.github/workflows/web.yml): superuser for
# migrations, non-superuser `app_login` / `auth_login` that SET ROLE into the
# RLS-enforced vantage_app / vantage_auth groups, a seeded team, and password
# logins you can sign in with (see AGENTS.md).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vantage
      # CI creates the scratch DB with LC_COLLATE 'C'; match it.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vantage"]
      interval: 5s
      timeout: 5s
      retries: 20

  install:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm install
    restart: "no"

  # One-shot: migrations → RLS logins → seed team/event → seed password logins.
  # Shares the db container's network namespace so the seed scripts' loopback
  # safety check (they refuse non-localhost hosts) passes.
  db-setup:
    image: node:22
    working_dir: /app
    network_mode: "service:db"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantage?sslmode=disable
      RLS_PROOF_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantage
    command: >
      sh -c "node scripts/run-migrations.mjs
      && RLS_PROOF_APP_URL=postgresql://app_login:app@127.0.0.1:5432/vantage RLS_PROOF_SET_ROLE=vantage_app node scripts/rls-proof-prepare-app-login.mjs
      && RLS_PROOF_APP_URL=postgresql://auth_login:auth@127.0.0.1:5432/vantage RLS_PROOF_SET_ROLE=vantage_auth node scripts/rls-proof-prepare-app-login.mjs
      && node scripts/seed-dev.mjs
      && node scripts/seed-e2e-logins.mjs"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully

  web:
    image: node:22
    working_dir: /app/apps/web
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/apps/web/.next
    command: /app/node_modules/.bin/next dev --port 3000 --hostname 0.0.0.0
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults   # local-only placeholders; real secrets override
      - /run/base44/app.env      # platform-delivered secrets — LAST, always wins
    environment:
      # next.config.ts allowedDevOrigins — never hardcode the resolved host.
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_APP_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_SITE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BETTER_AUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BETTER_AUTH_URL_LOCAL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Local Postgres (compose-managed, not user secrets).
      - DATABASE_DRIVER=pg
      - DATABASE_URL=postgresql://app_login:app@db:5432/vantage?sslmode=disable
      - DATABASE_URL_UNPOOLED=postgresql://postgres:postgres@db:5432/vantage?sslmode=disable
      - DATABASE_AUTH_URL=postgresql://auth_login:auth@db:5432/vantage?sslmode=disable
      - DATABASE_ADMIN_URL=postgresql://postgres:postgres@db:5432/vantage?sslmode=disable
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  node_modules:
  next_cache:
